# Cloud Build config for the DIRECTORY service (rig-directory) — the second
# Cloud Run service in the dual-run plan. The original cloudbuild.yaml keeps
# deploying the old ads service (rig-ads-website) from main, untouched.
#
# Differences from cloudbuild.yaml, on purpose:
#  - _SERVICE_NAME=rig-directory (separate Cloud Run service)
#  - NO _GTAG_CALL_CONVERSION build-arg — the legacy click-conversion event
#    must stay disabled on directory pages (see DUAL-RUN-PLAN.md)
#  - MECHANICS_EXPORT_TOKEN from Secret Manager, passed to the builder stage
#    so prebuild pulls the latest mechanics export; if the secret is missing
#    or the endpoint is down the build still succeeds on committed data
#  - no --no-cache (Cloud Build workers start cold anyway)
#
# One-time GCP setup: see data/directory/DEPLOY-DIRECTORY.md
steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    secretEnv: ['MECHANICS_EXPORT_TOKEN']
    entrypoint: bash
    args:
      - '-c'
      - |
        docker build \
        -t $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
        --build-arg NEXT_PUBLIC_API_URL=$_API_URL \
        --build-arg NEXT_PUBLIC_GTAG_ID=$_GTAG_ID \
        --build-arg NEXT_PUBLIC_GTAG_CALL_CONVERSION_TOLLFREE=$_GTAG_CALL_CONVERSION_TOLLFREE \
        --build-arg MECHANICS_EXPORT_TOKEN=$$MECHANICS_EXPORT_TOKEN \
        . \
        -f Dockerfile
    timeout: 1800s
  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - '$_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: Deploy
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run services update $_SERVICE_NAME \
        --platform=managed \
        --image=$_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
        --labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID \
        --region=$_DEPLOY_REGION \
        --memory=512Mi \
        --cpu=1 \
        --min-instances=1 \
        --quiet && \
        gcloud run services add-iam-policy-binding $_SERVICE_NAME \
        --platform=managed \
        --region=$_DEPLOY_REGION \
        --member="allUsers" \
        --role="roles/run.invoker" \
        --quiet
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/mechanics-export-token/versions/latest
      env: MECHANICS_EXPORT_TOKEN
images:
  - '$_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
options:
  substitutionOption: ALLOW_LOOSE
substitutions:
  _DEPLOY_REGION: us-central1
  _GCR_HOSTNAME: us.gcr.io
  _PLATFORM: managed
  _SERVICE_NAME: rig-directory
  _API_URL: https://api.bigrig.app
  _GTAG_ID: 'AW-10844383792'
  _GTAG_CALL_CONVERSION_TOLLFREE: 'PgBXCLzqz6AcELDUgLMo'
tags:
  - rig-directory
timeout: 3600s
